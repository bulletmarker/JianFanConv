name: Sync from Gitee

# Gitee 是唯一真源：本地只推 Gitee，这个工作流把 Gitee 的全部分支与标签镜像到 GitHub。
# 为什么不用本地推 GitHub：国内网络到 github.com:22/443 不稳定，GitHub 侧拉取更可靠。
# 不需要配置任何 secret：拉 Gitee 用公开 HTTPS，推回自己用内置的 GITHUB_TOKEN。

on:
  schedule:
    # GitHub 的最小粒度是 5 分钟；免费额度下实际可能有十几分钟延迟。
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Gitee into this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_REPO: https://gitee.com/machangsheng/jian-fan-conv.git
        run: |
          set -euo pipefail
          git clone --quiet --mirror "$GITEE_REPO" gitee.git
          cd gitee.git
          # --mirror 会把 Gitee 上不存在的分支/标签从 GitHub 上删掉（Gitee 是真源）
          git push --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
